version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fulcrums-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fulcrums
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/fulcrums --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fulcrums-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/fulcrums
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-fulcrums-ca}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-fulcrums-ca.firebasestorage.app}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://fulcrums.ca}
    volumes:
      - ./app:/app/app
      - ./firebase-credentials:/app/firebase-credentials:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
    driver: local
